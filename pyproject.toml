[project]
name = "fetchwin"
version = "0.1.0"
description = "Script the download of official Windows ESD media from Microsoft and assemble a bootable ISO."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fetchwin = "fetchwin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fetchwin"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and spawn local helper processes by design.
"tests/**" = ["S101", "S603", "S607"]
# subprocess is the whole point of tools/convert; argv lists only, never shell=True.
"src/fetchwin/tools.py" = ["S603"]
"src/fetchwin/convert.py" = ["S603"]
# Catalog XML comes from Microsoft over HTTPS and is size-limited; expat >= 2.4 blocks entity bombs.
"src/fetchwin/catalog.py" = ["S314"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs real wimlib-imagex and mkisofs/genisoimage (fails, never skips, if absent)"]
